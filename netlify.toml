# Optional: host ONLY the website on Netlify (the API runs elsewhere — see SETUP.md "Hosting the site and API separately").
# Set VITE_API_ROOT (build-time) to the API address and CORS_ORIGINS on the API to this site's address.
[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
