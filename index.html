    <meta name="theme-color" content="#0b0705" />
    <script>
      /* apply the saved theme before first paint (no flash); default is system */
      try {
        var saved = localStorage.getItem("narxtop_theme");
        /* no saved choice (or "system") follows the phone / PC; only an explicit "light" or "dark" is fixed */
        var pref = saved === "light" || saved === "dark" ? saved : "system";
        var t = pref === "system" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : pref;
        document.documentElement.dataset.theme = t; document.documentElement.dataset.themePreference = pref;
        document.documentElement.style.colorScheme = t;
        document.querySelector('meta[name="theme-color"]')?.setAttribute("content", t === "light" ? "#e8d5c1" : "#0b0705");
      } catch (e) { document.documentElement.dataset.theme = "dark"; }
      try { var mr = JSON.parse(localStorage.getItem("narxtop_motion") || '"system"'); var m = mr && typeof mr === "object" && "value" in mr ? mr.value : mr; document.documentElement.dataset.motion = m === "off" || (m === "system" && matchMedia("(prefers-reduced-motion: reduce)").matches) ? "off" : "on"; } catch (e) { document.documentElement.dataset.motion = matchMedia("(prefers-reduced-motion: reduce)").matches ? "off" : "on"; }
    </script>
